# Optional: Postgres + pgvector in Docker (alternative to a local Homebrew install).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: archaeologist
      POSTGRES_USER: archaeologist
      POSTGRES_PASSWORD: archaeologist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
